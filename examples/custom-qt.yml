# Any other stack: tell LiveNiro how to install, build and run it.
# This one is a Qt/CMake app; the same pattern works for SFML, Swing, Tkinter, raylib, SDL ...
name: LiveNiro demo

on:
  push:
    branches: [main]
    paths-ignore: [".liveniro/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Kairo-2081/LiveNiro@v0
        with:
          stack: custom
          setup: sudo apt-get install -y qt6-base-dev cmake
          build: cmake -B build && cmake --build build -j
          run: ./build/myapp
