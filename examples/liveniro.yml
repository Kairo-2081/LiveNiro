# Copy this file to .github/workflows/liveniro.yml in your project.
# On every push to main, LiveNiro builds your app, records it, and puts the GIF in your README.
name: LiveNiro demo

on:
  push:
    branches: [main]
    paths-ignore: [".liveniro/**"]
  workflow_dispatch:

permissions:
  contents: write   # lets LiveNiro commit the GIF back

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Kairo-2081/LiveNiro@v0
