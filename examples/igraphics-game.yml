# iGraphics game: click "New Game" on the menu, then play for a few seconds.
# Coordinates are pixels from the top-left of the game window.
name: LiveNiro demo

on:
  push:
    branches: [main]
    paths-ignore: [".liveniro/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Kairo-2081/LiveNiro@v0
        with:
          duration: "14"
          actions: |
            wait 1.5
            click 1000 80     # "New Game"
            wait 1.5
            hold Right 2.5
            key Up            # jump
            hold Right 3
