name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pygame:
    name: pygame fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: test/fixtures/pygame-bouncer
          name: pygame-bouncer
          duration: "6"
          actions: |
            wait 0.5
            hold Left 1.5
            hold Right 2.5
          readme: ""
          commit: "false"

  igraphics:
    name: iGraphics tour (Bounce Classic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kairo-2081/Bounce-Classic
          path: projects/bounce-classic
      - id: tour
        uses: ./
        with:
          path: projects/bounce-classic
          name: bounce-classic
          scenes: |
            ## Main menu
            wait 2.5

            ## Leaderboard
            click 1000 338
            wait 3
            key c

            ## Help
            click 1000 465
            wait 3

            ## Level 1
            restart
            click 1000 80
            move 1278 718
            hold Right 2.5
            key Up
            hold Right 2
            key Up
            hold Right 2

            ## Level 2
            sh printf '2 0 65 100 100' > saved.txt
            restart
            click 1000 213
            move 1278 718
            hold Right 2
            key Up
            hold Right 2.5

            ## Level 3
            sh printf '3 0 65 100 200' > saved.txt
            restart
            click 1000 213
            move 1278 718
            hold Right 2
            key Up
            hold Right 2.5
          readme: ""
          commit: "false"
      - name: Check the tour
        shell: bash
        run: |
          test "${{ steps.tour.outputs.scenes }}" = "6" || { echo "Expected 6 scenes, got '${{ steps.tour.outputs.scenes }}'"; exit 1; }
          ls -la .liveniro
          test -s .liveniro/bounce-classic-tour.mp4
          test "$(ffprobe -v error -show_chapters -of csv=p=0 .liveniro/bounce-classic-tour.mp4 | wc -l)" = "6"

  javafx:
    name: JavaFX (LibraryManager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kairo-2081/LibraryManager
          path: projects/library-manager
      - uses: ./
        with:
          path: projects/library-manager
          name: library-manager
          window: Bookverse - Login
          duration: "14"
          actions: |
            wait 1.5
            click 537 403            # "Log In" (inside the button in both the old and new welcome layout)
            wait 1.5
            focus Bookverse Login    # the login dialog
            click 468 227            # email field
            type s
            click 468 303            # password field
            type s
            wait 0.5
            click 408 356            # LOG IN
            wait 4
          readme: ""
          commit: "false"
